# Kimodo inference server: the model is preloaded once at FastAPI startup and
# inference runs in-process. The model stays resident in VRAM while the server
# runs (stop the api container to free it). The kimodo_motion HDA fetches the
# NPZ over HTTP, so the server can run on this machine or a remote GPU box.
#
# Lives alongside Kimodo's own docker-compose.yaml in the kimodo repo, hence the
# distinct filename — always pass it with -f.
# Usage (on the GPU host, from the kimodo dir):
#   MOCK_MODE=0 docker compose -f docker-compose.bridge.yaml up text-encoder -d  # wait until healthy
#   MOCK_MODE=0 docker compose -f docker-compose.bridge.yaml up api -d
# Shared between both services, so the HF cache mount and the GPU reservation cannot
# drift apart (a second copy of the weights is a 10 GB mistake).
x-workspace: &workspace
  - ./:/workspace
  - ${HF_HOME:-${HOME}/.cache/huggingface}:/workspace/.cache/huggingface

x-hf-env: &hf-env
  # TEXT_ENCODERS_DIR: the local McGill adapters, base repointed to the ungated
  # NousResearch mirror.
  TEXT_ENCODERS_DIR: /workspace/text_encoders
  HF_HOME: /workspace/.cache/huggingface
  HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
  # Resolve from the local cache and never touch the network. Both services need this,
  # not just api: transformers probes for the single-file `model.safetensors` before
  # falling back to the sharded index, and that probe is a network call. With the hub
  # reachable it 404s and the shards load; with it unreachable the probe raises and the
  # encoder dies at startup even though all 25 GB are sitting in the cache.
  # Set HF_HUB_OFFLINE=0 for a one-time download.
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  HF_HUB_DISABLE_XET: "1"   # the hf_xet downloader was observed to hang on this setup

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  text-encoder:
    image: kimodo:1.0
    container_name: text-encoder
    working_dir: /workspace
    command: python -m kimodo.scripts.run_text_encoder_server
    volumes: *workspace
    ports:
      - "9550:9550"
    environment:
      <<: *hf-env
      # cpu keeps VRAM free (the encoder is the bulk of Kimodo's GPU footprint) at the
      # cost of ~14 GB of host RAM and ~30 s of encoding per segment. cuda is much
      # faster but wants roughly 14 GB of VRAM on top of the motion model.
      TEXT_ENCODER_DEVICE: ${TEXT_ENCODER_DEVICE:-cpu}
    deploy:                     # needed for TEXT_ENCODER_DEVICE=cuda; harmless on cpu
      <<: *gpu
    healthcheck:
      # Hit /config (the gradio config endpoint kimodo's TextEncoderAPI fetches on
      # connect), not just / — otherwise "healthy" can race ahead of gradio being
      # ready and the api's model preload times out connecting to the encoder.
      test: ["CMD", "bash", "-lc", "curl -fsS http://localhost:9550/config > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 120  # CPU model loading can take up to 10 minutes on first run

  api:
    image: kimodo:1.0
    container_name: kimodo-api
    working_dir: /workspace
    command: uvicorn kimodo_server:app --host 0.0.0.0 --port ${KIMODO_PORT:-8001}
    volumes: *workspace
    ports:
      - "${KIMODO_PORT:-8001}:${KIMODO_PORT:-8001}"
    environment:
      <<: *hf-env
      KIMODO_MODEL: ${KIMODO_MODEL:-}   # model to preload at startup (blank = kimodo default)
      MOCK_MODE: ${MOCK_MODE:-0}        # 0 = live inference; 1 = serve dev_reference.npz
      OUTPUT_DIR: /workspace/output
      TEXT_ENCODER_URL: "http://text-encoder:9550/"
      # Never "auto". Kimodo's auto mode probes the encoder and, on any failure,
      # silently loads its own copy of the 14 GB LLM2Vec instead, a second one on the
      # same GPU as the text-encoder container's. Fail loudly and let the restart
      # policy below wait the encoder out.
      TEXT_ENCODER_MODE: api
      # Seconds one segment spends encoding text, used only to make the progress bar
      # creep during the phase the model reports nothing for. Measured CPU default;
      # lower it (or ignore it) when the encoder runs on the GPU.
      KIMODO_ENCODE_EST_S: ${KIMODO_ENCODE_EST_S:-30}
      # Offline resolution and the xet opt-out come from x-hf-env; the model is
      # preloaded at startup and must already be cached (`huggingface-cli download
      # nvidia/Kimodo-SOMA-RP-v1.1`).
    deploy:
      <<: *gpu
    # depends_on is honoured by `docker compose up` only: Docker Desktop's Start
    # button, `docker start`, and a daemon restart all launch both containers at once,
    # and the encoder binds :9550 only after its model is loaded (~100 s on cuda, up to
    # 10 min on cpu). Retrying is what restarting the container by hand used to do.
    restart: on-failure
    depends_on:
      text-encoder:
        condition: service_healthy
